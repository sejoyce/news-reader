# Publishes main at the site root and the staging branch under /staging/.
# Build and deploy are separate jobs, which is the layout GitHub recommends for Pages.
name: Deploy Pages
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: staging, path: site-staging }
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='worker' --exclude='.github' site/ _site/
          if [ -d site-staging ]; then
            mkdir -p _site/staging
            rsync -a --exclude='.git' --exclude='worker' --exclude='.github' site-staging/ _site/staging/
          fi
          ls _site _site/staging 2>/dev/null | head -30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
